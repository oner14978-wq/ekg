name: build-exe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exe:
    runs-on: windows-11-arm
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verificar e juntar os zips do projeto
        run: |
          mkdir -p proj
          shopt -s nullglob
          zips=(*.zip)
          [ ${#zips[@]} -gt 0 ] || { echo "Nenhum .zip na raiz do repositorio."; exit 1; }
          for z in "${zips[@]}"; do
            7z t "$z" > /dev/null || { echo "ZIP COM PROBLEMA: $z"; exit 1; }
            echo "Extraindo $z"; 7z x -y -oproj "$z" > /dev/null
          done
          for i in 1 2; do
            find proj -name '*parte*.zip' -print0 | while IFS= read -r -d '' z; do
              7z t "$z" > /dev/null || { echo "ZIP INTERNO COM PROBLEMA: $z"; exit 1; }
              7z x -y -o"$(dirname "$z")" "$z" > /dev/null && rm "$z"
            done
          done
          cargo_toml=$(find proj -maxdepth 3 -name Cargo.toml -path '*' | xargs grep -l '^\[workspace\]' | head -1)
          [ -n "$cargo_toml" ] || { echo "Cargo.toml do workspace nao encontrado"; exit 1; }
          src=$(dirname "$cargo_toml")
          for f in Cargo.toml Cargo.lock crates/horizon-client/Cargo.toml; do
            test -f "$src/$f" || { echo "Arquivo faltando no projeto: $f"; exit 1; }
          done
          echo "SRC=$src" >> "$GITHUB_ENV"
          echo "Projeto completo em $src"
      - name: Corrigir dependencia starling-account no horizon-client
        working-directory: ${{ env.SRC }}
        run: |
          cli="crates/horizon-client/Cargo.toml"
          if grep -Eq '^[[:space:]]*starling[-_]account[[:space:]]*(=|\.)' "$cli"; then
            echo "Dependencia starling-account ja declarada."; exit 0
          fi
          acc=$(grep -rlE --include=Cargo.toml '^name[[:space:]]*=[[:space:]]*"starling[-_]account"' . | grep -v '/target/' | head -1 || true)
          [ -n "$acc" ] || { echo "O crate starling-account NAO existe neste projeto."; exit 1; }
          rel=$(realpath --relative-to="crates/horizon-client" "$(dirname "$acc")")
          line="starling-account = { path = \"$rel\" }"
          if grep -q '^\[dependencies\]' "$cli"; then
            sed -i "0,/^\[dependencies\]/s||[dependencies]\n$line|" "$cli"
          else
            printf '\n[dependencies]\n%s\n' "$line" >> "$cli"
          fi
          echo "Adicionado em $cli: $line"
      - name: Instalar Rust
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
      - name: Compilar o EXE
        working-directory: ${{ env.SRC }}
        run: |
          set +e
          cargo build --release -p horizon-client --target x86_64-pc-windows-msvc > build.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            awk '/^error/{p=1} p{print} /^$/{p=0}' build.log | head -n 60 > erros.txt
            [ -s erros.txt ] || tail -n 25 build.log > erros.txt
            echo "===== ERRO AO COMPILAR O EXE ====="
            cat erros.txt
            { echo "## Erro ao compilar o EXE"; echo '```'; cat erros.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi
          echo "EXE compilado sem erros."
      - name: Guardar o log completo (so se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Log-completo-exe
          path: ${{ env.SRC }}/build.log
          retention-days: 7
      - name: Nomear o EXE
        working-directory: ${{ env.SRC }}/target/x86_64-pc-windows-msvc/release
        run: |
          exe=$(ls *.exe | head -1)
          cp "$exe" "Cat-Launcher-pc.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Cat-Launcher-exe
          path: ${{ env.SRC }}/target/x86_64-pc-windows-msvc/release/Cat-Launcher-pc.exe
          if-no-files-found: error
          retention-days: 30
