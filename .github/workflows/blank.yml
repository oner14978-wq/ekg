name: build-launcher
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exe:
    runs-on: windows-11-arm
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verificar e juntar os zips do projeto
        run: |
          mkdir -p proj
          shopt -s nullglob
          zips=(*.zip)
          [ ${#zips[@]} -gt 0 ] || { echo "Nenhum .zip na raiz do repositorio."; exit 1; }
          for z in "${zips[@]}"; do
            7z t "$z" > /dev/null || { echo "ZIP COM PROBLEMA: $z"; exit 1; }
            echo "Extraindo $z"; 7z x -y -oproj "$z" > /dev/null
          done
          for i in 1 2; do
            find proj -name '*parte*.zip' -print0 | while IFS= read -r -d '' z; do
              7z t "$z" > /dev/null || { echo "ZIP INTERNO COM PROBLEMA: $z"; exit 1; }
              7z x -y -o"$(dirname "$z")" "$z" > /dev/null && rm "$z"
            done
          done
          launcher_toml=$(find proj -maxdepth 3 -path '*/launcher/Cargo.toml' | head -1)
          [ -n "$launcher_toml" ] || { echo "launcher/Cargo.toml nao encontrado: faltam partes do projeto?"; exit 1; }
          dir=$(dirname "$launcher_toml")
          root=$(dirname "$dir")
          for f in launcher/Cargo.lock crates/horizon-core/Cargo.toml crates/horizon-prepare/Cargo.toml; do
            test -f "$root/$f" || { echo "Arquivo faltando no projeto: $f"; exit 1; }
          done
          echo "LAUNCHER=$dir" >> "$GITHUB_ENV"
          echo "Launcher em $dir"
      - name: Instalar Rust
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
      - name: Compilar o launcher
        working-directory: ${{ env.LAUNCHER }}
        run: |
          set +e
          cargo build --release --target x86_64-pc-windows-msvc > build.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            awk '/^error/{p=1} p{print} /^$/{p=0}' build.log | head -n 60 > erros.txt
            [ -s erros.txt ] || tail -n 25 build.log > erros.txt
            echo "===== ERRO AO COMPILAR O LAUNCHER ====="
            cat erros.txt
            { echo "## Erro ao compilar o launcher"; echo '```'; cat erros.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi
          echo "Executaveis gerados:"
          find target/x86_64-pc-windows-msvc/release -maxdepth 1 -name '*.exe'
      - name: Guardar o log completo (so se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Log-completo-launcher
          path: ${{ env.LAUNCHER }}/build.log
          retention-days: 7
      - name: Juntar o EXE
        working-directory: ${{ env.LAUNCHER }}
        run: |
          mkdir -p saida
          find target/x86_64-pc-windows-msvc/release -maxdepth 1 -name '*.exe' -exec cp {} saida/ \;
          ls saida/*.exe > /dev/null 2>&1 || { echo "Nenhum .exe gerado."; exit 1; }
          ls -la saida
      - uses: actions/upload-artifact@v4
        with:
          name: Cat-Launcher-exe
          path: ${{ env.LAUNCHER }}/saida/*.exe
          if-no-files-found: error
          retention-days: 30
          
